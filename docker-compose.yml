version: '3.8'

services:
  pay-once-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pay-once-gateway-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # If custom configuration is needed, they can be specified as environment variables here.
      # e.g.,
      # - SERVER_PORT=8080
    restart: unless-stopped
